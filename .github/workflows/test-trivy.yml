name: Test Trivy

on:
  workflow_dispatch:
    inputs:
      image:
        description: Published image to scan
        required: true
        default: ghcr.io/aristanetworks/avd/universal:python3.12-avd-devel
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ inputs.image }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          format: sarif
          output: trivy.sarif
          exit-code: "1"

      # Findings fail the scan step; still publish any report it produced.
      - name: Publish SARIF
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.arch }}

      - name: Retain report
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.arch }}
          path: trivy.sarif
