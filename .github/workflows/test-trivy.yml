name: Test Trivy

"on":
  workflow_dispatch:
    inputs:
      image:
        description: Published image to scan
        required: true
        default: ghcr.io/aristanetworks/avd/universal:python3.12-avd-devel
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Scan published image
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ inputs.image }}
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "true"
          format: json
          output: trivy.json
          # Upload reports before failing for vulnerabilities.
          exit-code: "0"

      - name: Show vulnerability table in job summary
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        run: |
          trivy convert --format table --severity HIGH,CRITICAL --output trivy.txt trivy.json
          {
            echo '### Fixable HIGH/CRITICAL vulnerabilities'
            echo '```text'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate HTML report
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        run: |
          # Official HTML template from the same Trivy v0.76.2 release.
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/3f6334d223b52188324af3b9923b4249cd206652/contrib/html.tpl \
            -o "$RUNNER_TEMP/trivy-html.tpl"
          trivy convert --format template --template "@$RUNNER_TEMP/trivy-html.tpl" \
            --output trivy.html trivy.json

      - name: Generate SARIF
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        run: trivy convert --format sarif --output trivy.sarif trivy.json

      - name: Publish SARIF
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.arch }}

      - name: Retain reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.arch }}
          path: |
            trivy.json
            trivy.txt
            trivy.html
            trivy.sarif
          if-no-files-found: warn

      - name: Fail on fixable HIGH or CRITICAL vulnerabilities
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        run: trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 trivy.json
